<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#19252b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Lumo, una aventura original de bolsillo inspirada en los juegos Java de los teléfonos con botones.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css">
<title>LUMO · Historias de bolsillo</title></head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="app"><header class="masthead"><div><span class="mast-label">UNA AVENTURA DE BOLSILLO · 2026</span><h1>LUMO <small>historias de bolsillo</small></h1></div><div class="header-actions"><button id="audioBtn" class="micro" aria-label="Activar o silenciar música" title="Música">♫</button><button id="expandBtn" class="micro" aria-label="Pantalla completa" title="Pantalla completa">⛶</button></div></header>
<section class="phone" aria-label="Consola de juego"><div class="earpiece"><span></span></div><div class="screen-wrap"><div class="screen-shine"></div><canvas id="game" width="384" height="256" aria-label="Lumo: videojuego de plataformas 2D retro"></canvas><div id="hint" class="screen-hint" aria-live="polite"></div></div>
<div class="branding"><span>✶ LUMO</span><span>POCKET SYSTEM / 08</span></div>
<div class="keys"><div class="aux"><button data-action="back" aria-label="Volver o pausar">VOLVER</button><button data-action="ok" aria-label="Aceptar">ACEPTAR</button></div><div class="gamepad"><button data-hold="left" class="key direction left" aria-label="Mover a la izquierda"><span>◀</span><small>4</small></button><button data-hold="right" class="key direction right" aria-label="Mover a la derecha"><span>▶</span><small>6</small></button><button data-hold="jump" class="key jump" aria-label="Saltar"><span>↑</span><small>2 / SALTO</small></button><button data-action="shape" class="key shape" aria-label="Cambiar forma"><span>◈</span><small>5 / FORMA</small></button></div><div class="helper">También puedes usar <b>← → / ESPACIO / X / ENTER / ESC</b> con teclado.</div></div>
</section><footer class="foot"><div class="dot"></div><span>Hecho para jugar, recordar y descubrir.</span><span id="saveStatus">GUARDADO LOCAL</span></footer></main>
<script src="scores.js"></script><script src="audio.js"></script><script src="levels.js"></script><script src="game.js"></script>
</body></html>
